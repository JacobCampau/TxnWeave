services:
  api:
    build:
      context: ./apps/api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - TXNWEAVE_DB_PATH=/data/txnweave.db
    volumes:
      # The SQLite database is the autosave (B2), so it lives on a named volume
      # that survives rebuilding the container.
      - txnweave-data:/data

  web:
    build:
      context: ./apps/web
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api

volumes:
  txnweave-data:
